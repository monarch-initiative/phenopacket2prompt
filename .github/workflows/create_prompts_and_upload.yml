name: Process Phenopackets and Upload to Zenodo

on:
  workflow_call: {} # Allow calling from another workflow

jobs:
  process-phenopackets:
    runs-on: ubuntu-latest
    environment: create_prompts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '22.0.1'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Download latest HPO
        run: |
          java -jar target/phenopacket2prompt.jar download -w

      - name: Fetch latest phenopackets
        id: dirout
        run: |
          mkdir -p phenopackets-data
          wget -O phenopackets.zip https://github.com/monarch-initiative/phenopacket-store/releases/latest/download/all_phenopackets.zip
          unzip phenopackets.zip -d phenopackets-data
          echo "DIR_NAME=$(unzip -l phenopackets.zip | awk '/\/$/ {print $NF; exit}')" >> $GITHUB_OUTPUT
          rm phenopackets.zip
 
      - name: Run batch processing
        run: |
          java -jar target/phenopacket2prompt.jar batch -d phenopackets-data/${{steps.dirout.outputs.DIR_NAME}} -p --full-translations -j

      - name: Zip original phenopackets for upload
        run: |
          zip -r prompts/original_phenopackets.zip prompts/original_phenopackets
          rm -r prompts/original_phenopackets

      - name: Set up Python for subsequent upload to zenodo
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'  # Use latest stable version

      - name: Install python dependencies
        run: pip install requests

      - name: Upload new output to Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          ZENODO_DEPOSITION_ID: ${{ secrets.ZENODO_DEPOSITION_ID }}
          LATEST_STORE_TAG: ${{ inputs. LATEST_STORE }}
          LATEST_HPO_TAG: ${{ inputs.LATEST_HPO }}
        run: python scripts/update_and_release_to_zenodo.py prompts/


